name: Pokémon Center stok takibi

on:
  schedule:
    - cron: "*/5 * * * *"   # her 5 dakikada bir (GitHub'ın izin verdiği en sık aralık)
  workflow_dispatch:         # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write            # state.json'u repoya geri yazabilmek için

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Stok kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "0"
        run: xvfb-run -a python monitor.py

      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state güncellendi"
            git push
          fi
